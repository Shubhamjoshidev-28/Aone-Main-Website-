<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | A-One Barbeque</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-panel">
      <div class="auth-brand">
        <div class="auth-brand-icon"><i class="fa-solid fa-utensils"></i></div>
        <h2>A-One Barbeque</h2>
        <p>Manage orders, menu and sales — all in one place.</p>
      </div>
      <ul class="auth-highlights">
        <li><i class="fa-solid fa-bolt"></i> Real-time live orders</li>
        <li><i class="fa-solid fa-chart-line"></i> Daily, weekly &amp; monthly analytics</li>
        <li><i class="fa-solid fa-receipt"></i> One-tap invoice generation</li>
      </ul>
    </div>

    <div class="auth-form-wrap">
      <div class="auth-card card card-pad">
        <h1 class="page-title">Welcome back</h1>
        <p class="page-subtitle">Log in to your owner dashboard</p>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-user"></i>
              <input class="form-input" type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required />
            </div>
            <span class="form-error" id="username-error"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-lock"></i>
              <input class="form-input" type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
              <i class="fa-solid fa-eye toggle-password" id="toggle-password"></i>
            </div>
            <span class="form-error" id="password-error"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="login-btn" data-loading-disable>
            <i class="fa-solid fa-right-to-bracket"></i> Login
          </button>
        </form>

        <p class="auth-switch">
          Don't have an owner account?
          <a href="register.html">Register here</a>
        </p>
        <a class="auth-switch-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to customer menu</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
