<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu | A-One Barbeque</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/menu.css" />
</head>
<body>

  <div class="app-shell">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon"><i class="fa-solid fa-utensils"></i></div>
        <h2>A-One Barbeque</h2>
        <button class="btn btn-icon sidebar-close" id="sidebar-close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link" data-page="dashboard.html"><i class="fa-solid fa-receipt"></i> Orders</a>
        <a href="analytics.html" class="sidebar-link" data-page="analytics.html"><i class="fa-solid fa-chart-pie"></i> Analytics</a>
        <a href="menu.html" class="sidebar-link" data-page="menu.html"><i class="fa-solid fa-book-open"></i> Menu</a>
        <a href="staff.html" class="sidebar-link" data-page="staff.html"><i class="fa-solid fa-user-tie"></i> Staff</a>
      </nav>
      <div class="sidebar-footer">
        <button class="sidebar-link" id="logout-btn" style="width:100%"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
    </aside>

    <!-- ================= MAIN ================= -->
    <div class="app-main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-icon sidebar-toggle" id="sidebar-toggle"><i class="fa-solid fa-bars"></i></button>
          <span class="topbar-date" id="topbar-date"></span>
        </div>
        <div class="topbar-right">
          <button class="notification-bell" id="notification-bell">
            <i class="fa-solid fa-bell"></i>
            <span class="notification-dot" id="notification-dot"></span>
          </button>
          <div class="topbar-user">
            <div class="topbar-avatar" id="topbar-avatar">O</div>
            <div>
              <div class="topbar-user-name" id="topbar-user-name">Owner</div>
              <div class="topbar-user-role">Owner</div>
            </div>
          </div>
        </div>
      </header>

      <main class="app-content">
        <div class="flex-between page-heading">
          <div>
            <h1 class="page-title">Menu Management</h1>
            <p class="page-subtitle">Add, edit and manage every item on your menu.</p>
          </div>
          <button class="btn btn-primary" id="add-item-btn"><i class="fa-solid fa-plus"></i> Add Item</button>
        </div>

        <div class="menu-toolbar">
          <div class="input-icon-wrap menu-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input class="form-input" type="text" id="menu-search-input" placeholder="Search menu items..." />
          </div>
          <select class="form-select menu-category-filter" id="menu-category-filter">
            <option value="All">All Categories</option>
          </select>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Image</th>
                <th>Item Name</th>
                <th>Category</th>
                <th>Size</th>
                <th>Price</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="menu-table-body"></tbody>
          </table>
        </div>
        <div class="empty-state hidden" id="menu-table-empty">
          <i class="fa-solid fa-bowl-food"></i>
          <p>No menu items found.</p>
        </div>
      </main>
    </div>
  </div>

  <!-- ================= CREATE / EDIT ITEM MODAL ================= -->
  <div class="modal-overlay" id="item-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="item-modal-title">Add Menu Item</h3>
        <button class="modal-close" data-close-modal="item-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="item-form">
        <div class="modal-body">
          <input type="hidden" id="item-id" />
          <div class="form-group">
            <label class="form-label" for="item-name">Item Name</label>
            <input class="form-input" type="text" id="item-name" placeholder="e.g. Butter Chicken" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="item-category">Category</label>
              <select class="form-select" id="item-category" required>
                <option value="Special Items">Special Items</option>
                <option value="Tandoori Items">Tandoori Items</option>
                <option value="Non Veg Snacks">Non Veg Snacks</option>
                <option value="Non Veg Main Course">Non Veg Main Course</option>
                <option value="Kebab">Kebab</option>
                <option value="Fish Special">Fish Special</option>
                <option value="Veg Snacks">Veg Snacks</option>
                <option value="Veg Main Course">Veg Main Course</option>
                <option value="Roti / Prantha">Roti / Prantha</option>
                <option value="Pasta">Pasta</option>
                <option value="Beverages">Beverages</option>
                <option value="Salad">Salad</option>
                <option value="Extra">Extra</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="item-size">Size</label>
              <select class="form-select" id="item-size" required>
                <option value="Half">Half</option>
                <option value="Full">Full</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="item-price">Price (₹)</label>
              <input class="form-input" type="number" id="item-price" min="0.01" step="0.01" placeholder="0.00" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="item-available">Availability</label>
              <select class="form-select" id="item-available">
                <option value="true">Available</option>
                <option value="false">Unavailable</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-close-modal="item-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="item-save-btn" data-loading-disable><i class="fa-solid fa-floppy-disk"></i> Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= DELETE CONFIRM MODAL ================= -->
  <div class="modal-overlay" id="delete-item-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Delete Menu Item</h3>
        <button class="modal-close" data-close-modal="delete-item-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete <strong id="delete-item-name"></strong>? This cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-close-modal="delete-item-modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-delete-item-btn" data-loading-disable><i class="fa-solid fa-trash"></i> Delete</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
